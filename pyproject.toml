description = "Analysis for increase eGovbenchmark score"
authors = ["gabboDTD <gabriele.spina@teamdigitale.governo.it>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.2"
seaborn = "^0.13.2"
streamlit = "^1.36.0"
